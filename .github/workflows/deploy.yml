name: Multi-Account Vercel Auto-Deploy

on:
  workflow_dispatch:
    inputs:
      target_account:
        description: 'Which account do you want to deploy to?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - personal
          - manish
          - amit
          - test
          - khushi

jobs:
  # -------------------------------------------------------------
  # 1. BUILD VALIDATION GATEWAY (सबसे पहले बिल्ड टेस्ट होगा)
  # -------------------------------------------------------------
  build-check:
    name: Validate Next.js Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      # बिल्ड के समय अगर Next.js को एनवायरनमेंट वेरिएबल्स की ज़रूरत पड़े
      - name: Inject Build Environment Variables
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          ENABLE_DEVICE_LOCK=${{ secrets.ENABLE_DEVICE_LOCK }}
          ADMIN_SECRET_KEY=${{ secrets.ADMIN_SECRET_KEY }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_URI_USER=${{ secrets.MONGODB_URL_MANISH }}
          DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Run Next.js Production Build
        run: npm run build

  # -------------------------------------------------------------
  # 2. DEPLOY TO PERSONAL VERCEL (सिर्फ तभी चलेगा जब बिल्ड पास होगा)
  # -------------------------------------------------------------
  deploy-personal:
    name: Deploy to Personal Account
    needs: [build-check]
    if: ${{ github.event.inputs.target_account == 'personal' || github.event.inputs.target_account == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Inject Secure Environment Variables
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          ENABLE_DEVICE_LOCK=${{ secrets.ENABLE_DEVICE_LOCK }}
          ADMIN_SECRET_KEY=${{ secrets.ADMIN_SECRET_KEY }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_URI_USER=${{ secrets.MONGODB_URL_MANISH }}
          DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Deploy to Personal Vercel
        run: |
          vercel --prod \
            --token=${{ secrets.PERSONAL_VERCEL_TOKEN }} \
            --scope=${{ secrets.PERSONAL_VERCEL_ORG_ID }} \
            --name=inboxsend \
            --yes

  # -------------------------------------------------------------
  # 3. DEPLOY TO MANISH VERCEL (सिर्फ तभी चलेगा जब बिल्ड पास होगा)
  # -------------------------------------------------------------
  deploy-manish:
    name: Deploy to Manish Account
    needs: [build-check]
    if: ${{ github.event.inputs.target_account == 'manish' || github.event.inputs.target_account == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Inject Secure Environment Variables
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          ENABLE_DEVICE_LOCK=${{ secrets.ENABLE_DEVICE_LOCK }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_URI_USER=${{ secrets.MONGODB_URL_MANISH }}
          DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          EOF

      - name: Deploy to Manish Vercel
        run: |
          vercel --prod \
            --token=${{ secrets.MANISH_VERCEL_TOKEN }} \
            --scope=${{ secrets.MANISH_VERCEL_ORG_ID }} \
            --name=inboxsend-manish \
            --yes

  # -------------------------------------------------------------
  # 4. DEPLOY TO AMIT VERCEL (सिर्फ तभी चलेगा जब बिल्ड पास होगा)
  # -------------------------------------------------------------
  deploy-amit:
    name: Deploy to Amit Account
    needs: [build-check]
    if: ${{ github.event.inputs.target_account == 'amit' || github.event.inputs.target_account == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Inject Secure Environment Variables
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          ENABLE_DEVICE_LOCK=${{ secrets.ENABLE_DEVICE_LOCK }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_URI_USER=${{ secrets.MONGODB_URL_MANISH }}
          DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Deploy to Amit Vercel
        run: |
          vercel --prod \
            --token=${{ secrets.MANISH_VERCEL_TOKEN }} \
            --scope=${{ secrets.MANISH_VERCEL_ORG_ID }} \
            --name=inboxsend-amit \
            --yes
    # -------------------------------------------------------------
  # 4. DEPLOY TO AMIT VERCEL (सिर्फ तभी चलेगा जब बिल्ड पास होगा)
  # -------------------------------------------------------------
  deploy-test:
    name: Deploy to Test Account
    needs: [build-check]
    if: ${{ github.event.inputs.target_account == 'test' || github.event.inputs.target_account == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Inject Secure Environment Variables
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          ENABLE_DEVICE_LOCK=${{ secrets.ENABLE_DEVICE_LOCK }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_URI_USER=${{ secrets.MONGODB_URL_MANISH }}
          DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Deploy to Test Vercel
        run: |
          vercel --prod \
            --token=${{ secrets.MANISH_VERCEL_TOKEN }} \
            --scope=${{ secrets.MANISH_VERCEL_ORG_ID }} \
            --name=inboxsend-test \
            --yes
  
    # -------------------------------------------------------------
  # 2. DEPLOY TO PERSONAL VERCEL (सिर्फ तभी चलेगा जब बिल्ड पास होगा)
  # -------------------------------------------------------------
  deploy-khushi:
    name: Deploy to Khushi Account
    needs: [build-check]
    if: ${{ github.event.inputs.target_account == 'khushi' || github.event.inputs.target_account == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Inject Secure Environment Variables
        run: |
          cat <<EOF > .env.production
          NODE_ENV=production
          ENABLE_DEVICE_LOCK=${{ secrets.ENABLE_DEVICE_LOCK }}
          MONGODB_URI=${{ secrets.MONGODB_URI }}
          MONGODB_URI_USER=${{ secrets.MONGODB_URL_MANISH }}
          DB_ENCRYPTION_KEY=${{ secrets.DB_ENCRYPTION_KEY }}
          JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          EOF

      - name: Deploy to Khushi Vercel
        run: |
          vercel --prod \
            --token=${{ secrets.PERSONAL_VERCEL_TOKEN }} \
            --scope=${{ secrets.PERSONAL_VERCEL_ORG_ID }} \
            --name=inboxsend-khushi \
            --yes